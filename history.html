<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stepture — Push History</title>
  <style>
    :root { --bg:#ffffff; --card:#ffffff; --surface-2:#f7f8fa; --fg:#1a2233; --muted:#8b95a5; --border:#eaecf0; --primary:#3b6ef5; }
    body[data-theme="dark"] { --bg:#0f1420; --card:#171d2b; --surface-2:#1d2433; --fg:#e7ebf2; --muted:#8a94a6; --border:#2a3242; --primary:#5b8bff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:24px; }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 18px; font-size:14px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    button.act { font-size:13px; padding:7px 12px; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer; }
    button.act:hover { background:#eef1f5; }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:top; }
    th { background:#f0f3f7; font-weight:600; }
    tr:last-child td { border-bottom:none; }
    .kind { font-weight:600; }
    .kind.Bug { color:#b91c1c; }
    .kind.TestCase { color:#15803d; }
    .wi a { color:var(--primary); text-decoration:none; font-weight:600; }
    .copy { font-size:11px; padding:3px 7px; border:1px solid var(--border); background:#f5f7fa; border-radius:5px; cursor:pointer; margin-left:6px; }
    .copy:hover { background:#e8edf5; }
    .muted { color:var(--muted); font-size:12px; }
    .empty { color:var(--muted); font-style:italic; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>Push History</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div>
      <button class="act" id="copyAll">Copy all links</button>
      <button class="act" id="refreshBtn">↻ Refresh</button>
      <button class="act" id="clearBtn">Clear history</button>
    </div>
  </div>
  <div id="content"></div>

  <script src="history.js"></script>
</body>
</html>
